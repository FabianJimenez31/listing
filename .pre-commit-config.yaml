# IA-Framework: Python Pre-Commit Configuration
#
# NOTE: The primary local gate is bound via git `core.hooksPath=.claude/hooks/git`
# (installed by install.sh). This pre-commit-framework config is an OPTIONAL,
# equivalent path. If you use it, run:
#   pip install pre-commit && pre-commit install
# To run checks on all files:
#   pre-commit run --all-files

repos:
  # 1. Global standard Git hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024'] # Warns on files > 1MB

  # 2. Local project-specific validation gates.
  #    These delegate to the canonical scripts (the same ones bound via
  #    core.hooksPath) — a single source of truth, with no fragile shell
  #    embedded inside YAML.
  - repo: local
    hooks:
      # Full local quality gate: protected-branch + branch naming + spec presence
      # + hardcoded-secret scan + root temp-file block + architecture validation.
      - id: ia-framework-quality-gate
        name: IA-Framework local quality gate
        entry: bash .claude/hooks/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Enum integrity validator — DISABLED until the database schema and domain
      # Enums are defined. Re-enable once scripts/validation/validate_enums.py is
      # wired to the real DB connection and code Enums.
      # - id: ia-framework-enum-validator
      #   name: Database vs code enum validator
      #   entry: python3 scripts/validation/validate_enums.py
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-commit]
