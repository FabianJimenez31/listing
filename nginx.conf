server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Property photo uploads flow through /api/ — lift nginx's 1 MB default
    # so 1–10 MB images reach the backend instead of getting a 413.
    # 25 MB panorama limit plus multipart framing overhead.
    client_max_body_size 30M;

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SEO endpoints served by backend
    location /sitemap.xml {
        proxy_pass http://backend:8000;
    }
    location /robots.txt {
        proxy_pass http://backend:8000;
    }

    # Static uploads (served directly if not using S3)
    location /static/ {
        alias /app/temp/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Content-hashed build assets — safe to cache forever (filename changes on rebuild)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — all unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
